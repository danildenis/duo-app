<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>DUO — расчёт сайта</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap">
  <style>
    /* Заставка v2: тёмный фон, одно мягкое свечение за краем, логотип и тонкая полоска загрузки. */
    html, body { margin: 0; background: #0B0C0E; }
    #splash { position: fixed; inset: 0; z-index: 100; overflow: hidden; display: grid; place-items: center; background: #0B0C0E; transition: opacity .45s ease, visibility .45s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash .glow { position: absolute; width: 520px; height: 520px; right: -260px; top: -240px; border-radius: 50%; background: radial-gradient(circle, rgba(70,120,255,.55) 0%, rgba(40,150,190,.22) 40%, rgba(11,12,14,0) 70%); filter: blur(30px); }
    .splash-in { position: relative; display: grid; justify-items: center; gap: 26px; }
    #splash img { width: 112px; height: auto; opacity: 0; transform: translateY(8px); animation: logo-in .5s cubic-bezier(.2, .8, .2, 1) forwards; }
    #splash i { display: block; width: 88px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .12); overflow: hidden; position: relative; }
    #splash i::after { content: ''; position: absolute; inset: 0; width: 40%; background: #6E96FF; border-radius: 2px; animation: load 1.1s .3s ease-in-out infinite; transform: translateX(-100%); }
    @keyframes logo-in { to { opacity: 1; transform: none; } }
    @keyframes load { to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; opacity: 1; transform: none; } #splash i::after { animation: none; } }
  </style>
  <link rel="stylesheet" href="styles.css?v=1791662484">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <span class="glow"></span>
    <div class="splash-in"><img src="duo-logo-white.svg" alt=""><i></i></div>
  </div>
  <div class="glows" aria-hidden="true"><span></span><span></span></div>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="app.js?v=1791662484"></script>
</body>
</html>
